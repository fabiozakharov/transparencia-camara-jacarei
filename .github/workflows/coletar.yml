name: Coleta diária da Câmara de Jacareí

on:
  schedule:
    - cron: "17 9 * * *" # 6h17 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils
      - run: pip install -r coletor/requirements.txt
      - run: python coletor/coletar.py
      - run: python painel/gerar.py
      - name: Salvar dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados painel
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push
          fi
